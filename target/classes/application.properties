# ===============================
# SERVER
# ===============================

server.port=${PORT:8080}


# ===============================
# APPLICATION
# ===============================

spring.application.name=airline-reservation


# ===============================
# SECURITY DEFAULT USER
# ===============================

spring.security.user.password=adnan5050


# ===============================
# MYSQL DATABASE - RAILWAY
# ===============================

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=${MYSQLUSER}

spring.datasource.password=${MYSQLPASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


# ===============================
# SWAGGER
# ===============================

springdoc.swagger-ui.path=/swagger-ui.html